# Supabase project config.
#
# `verify_jwt = false` on these three is deliberate. The gateway's JWT check
# runs BEFORE the function does, and browsers don't send auth headers on a
# CORS preflight — so with it enabled every OPTIONS request 401s and the
# browser reports "preflight does not have HTTP ok status".
#
# None of these rely on the gateway for authorisation:
#   otp         must be callable by people who have no account yet; it has its
#               own limits (5 codes per email / 15 min, 5 wrong guesses, TTL)
#   send-email  verifies the caller's JWT itself and checks role + shipment
#               assignment before sending anything
#   geocode     is a public address lookup

project_id = "glihjyunknoczqwayzfa"

[functions.otp]
verify_jwt = false

[functions.send-email]
verify_jwt = false

[functions.geocode]
verify_jwt = false

[functions.auth-email]
verify_jwt = false
